name: SocialBoom CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: ./services/user-services
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Verify Docker Build
        run: docker build -t socialboom/user-service:test services/user-services

  build-booking-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: ./services/booking-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Verify Docker Build
        run: docker build -t socialboom/booking-service:test services/booking-service

  build-notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Verify Go Build
        working-directory: ./services/notification-service
        run: go build -v ./...

      - name: Run Go Unit Tests (with Testcontainers)
        working-directory: ./services/notification-service
        run: go test -v ./...
        
      - name: Verify Docker Build
        run: docker build -t socialboom/notification-service:test services/notification-service
