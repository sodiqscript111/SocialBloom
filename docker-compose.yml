version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_MULTIPLE_DATABASES: "testing,bookingsdb,notificationsdb"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  user-service:
    build:
      context: ./services/user-services
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@postgres/testing
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET_KEY=supersecretjwtkeythatshouldbechangedinprod
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - rabbitmq
    # Ensure migrations run if they were using alembic
    command: >
      bash -c "if [ -f alembic.ini ]; then alembic upgrade head; fi && uvicorn main:app --host 0.0.0.0 --port 8000"

  booking-service:
    build:
      context: ./services/booking-service
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@postgres/bookingsdb
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - NOTIFICATION_SERVICE_HOST=notification-service:50051
      - JWT_SECRET_KEY=supersecretjwtkeythatshouldbechangedinprod
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - rabbitmq
      - notification-service
    command: >
      bash -c "if [ -f alembic.ini ]; then alembic upgrade head; fi && uvicorn main:app --host 0.0.0.0 --port 8001"

  notification-service:
    build:
      context: ./services/notification-service
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@postgres/notificationsdb
    ports:
      - "50051:50051"
    depends_on:
      - postgres

  gateway:
    build:
      context: ./gateway
    ports:
      - "9000:9000"
    depends_on:
      - user-service
      - booking-service
      - notification-service

volumes:
  postgres_data:
