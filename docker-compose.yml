version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_MULTIPLE_DATABASES: "testing,bookingsdb,notificationsdb"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  user-service:
    build:
      context: ./services/user-services
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@postgres/testing
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET_KEY=supersecretjwtkeythatshouldbechangedinprod
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - kafka
    # Ensure migrations run if they were using alembic
    command: >
      bash -c "if [ -f alembic.ini ]; then alembic upgrade head; fi && uvicorn main:app --host 0.0.0.0 --port 8000"

  booking-service:
    build:
      context: ./services/booking-service
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@postgres/bookingsdb
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NOTIFICATION_SERVICE_HOST=notification-service:50051
      - JWT_SECRET_KEY=supersecretjwtkeythatshouldbechangedinprod
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - kafka
      - notification-service
    command: >
      bash -c "if [ -f alembic.ini ]; then alembic upgrade head; fi && uvicorn main:app --host 0.0.0.0 --port 8001"

  notification-service:
    build:
      context: ./services/notification-service
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@postgres/notificationsdb
    ports:
      - "50051:50051"
    depends_on:
      - postgres

  gateway:
    build:
      context: ./gateway
    ports:
      - "9000:9000"
    depends_on:
      - user-service
      - booking-service
      - notification-service

volumes:
  postgres_data:
