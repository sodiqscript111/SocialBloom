apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: socialboom-gateway
  namespace: socialboom
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: socialboom-virtual-service
  namespace: socialboom
spec:
  hosts:
  - "*"
  gateways:
  - socialboom-gateway
  http:
  - match:
    - uri:
        prefix: /notification.NotificationService/
    route:
    - destination:
        host: notification-service
        port:
          number: 50051
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes
  - match:
    - uri:
        prefix: /users
    - uri:
        prefix: /register
    - uri:
        prefix: /login
    - uri:
        prefix: /oauth
    route:
    - destination:
        host: user-service
        port:
          number: 8000
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,connect-failure,gateway-error
  - match:
    - uri:
        prefix: /bookings
    - uri:
        prefix: /campaigns
    - uri:
        prefix: /payments
    - uri:
        prefix: /reviews
    - uri:
        prefix: /chat
    route:
    - destination:
        host: booking-service
        port:
          number: 8001
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,connect-failure,gateway-error
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: booking-destination-rule
  namespace: socialboom
spec:
  host: booking-service
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 1m
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: user-destination-rule
  namespace: socialboom
spec:
  host: user-service
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 1m
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: notification-destination-rule
  namespace: socialboom
spec:
  host: notification-service
  trafficPolicy:
    connectionPool:
      http:
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 10s
      baseEjectionTime: 1m
      maxEjectionPercent: 50
